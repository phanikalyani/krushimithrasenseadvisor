## YAML Template.
version: '3.8'
services:
  postgres:
    image: ankane/pgvector:postgres-15
    environment:
      POSTGRES_USER: krushi
      POSTGRES_PASSWORD: krushi
      POSTGRES_DB: krushi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krushi"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  ml:
    build: ./ml-service
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://krushi:krushi@postgres:5432/krushi
      - EMBED_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - TTS_PROVIDER=gtts   # or "espeak" for offline
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/krushi
      - SPRING_DATASOURCE_USERNAME=krushi
      - SPRING_DATASOURCE_PASSWORD=krushi
      - ML_SERVICE_URL=http://ml:5001
      - JWT_SECRET=replace-with-a-very-long-secret-please-change
      - OTP_TTL_SECONDS=300
    depends_on:
      - postgres
      - ml
      - redis

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
        volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro


---
